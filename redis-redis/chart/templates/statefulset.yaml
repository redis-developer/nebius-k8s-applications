{{- include "redis.validate" . -}}
{{- $authEnabled := eq (include "redis.isTrue" .Values.auth.enabled) "true" -}}
{{- $persistenceEnabled := eq (include "redis.isTrue" .Values.persistence.enabled) "true" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "redis.fullname" . }}
  selector:
    matchLabels:
      {{- include "redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods whenever the config or password changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if $authEnabled }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "redis.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - redis-server
          args:
            - /etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if $authEnabled }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redis.secretName" . }}
                  key: redis-password
          {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                {{- if $authEnabled }}
                - redis-cli -p {{ .Values.service.port }} -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
                {{- else }}
                - redis-cli -p {{ .Values.service.port }} ping | grep -q PONG
                {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                {{- if $authEnabled }}
                - redis-cli -p {{ .Values.service.port }} -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
                {{- else }}
                - redis-cli -p {{ .Values.service.port }} ping | grep -q PONG
                {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
            {{- if $authEnabled }}
            - name: auth
              mountPath: /etc/redis/auth
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /data
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "redis.fullname" . }}
        {{- if $authEnabled }}
        - name: auth
          secret:
            secretName: {{ include "redis.secretName" . }}
            # 0440 so the non-root redis user (in fsGroup) can read the file.
            defaultMode: 0440
            items:
              - key: requirepass.conf
                path: requirepass.conf
        {{- end }}
        - name: data
        {{- if $persistenceEnabled }}
          persistentVolumeClaim:
            claimName: {{ include "redis.pvcName" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}

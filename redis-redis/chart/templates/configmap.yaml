apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    # Managed by the Redis Helm chart. Values come from .Values.redis in values.yaml.
    bind 0.0.0.0
    port {{ .Values.service.port }}
    protected-mode no
    dir /data
    appendonly yes
    maxmemory {{ .Values.redis.maxmemory }}
    maxmemory-policy {{ .Values.redis.maxmemoryPolicy }}
    {{- if .Values.auth.enabled }}
    # The password itself is never stored in this ConfigMap. It is provided by
    # the Secret {{ include "redis.secretName" . }}, mounted as a file and pulled
    # in here via the `include` directive so requirepass is set without exposing
    # the secret value in plain text.
    include /etc/redis/auth/requirepass.conf
    {{- end }}

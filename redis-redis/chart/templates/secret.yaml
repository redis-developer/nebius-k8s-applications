{{- if .Values.auth.enabled }}
{{- $password := include "redis.password" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis.secretName" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
type: Opaque
data:
  # Raw password, exposed to the container as the REDIS_PASSWORD env var and
  # used by clients to authenticate.
  redis-password: {{ $password | b64enc | quote }}
  # redis.conf `include` fragment that sets requirepass from the secret value.
  requirepass.conf: {{ printf "requirepass %s\n" $password | b64enc | quote }}
{{- end }}

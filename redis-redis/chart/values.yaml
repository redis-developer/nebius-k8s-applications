# Default values for the Redis chart.
# This is a YAML-formatted file.

# -- Number of Redis StatefulSet replicas. The chart deploys a single
# standalone Redis server by default. Increasing this is only meaningful with
# external replication/clustering configuration.
replicaCount: 1

# Official Redis Docker image.
# Nebius mirrors this image into its container registry during review and
# overrides image.repository with something like
# cr.eu-north1.nebius.cloud/marketplace/<path>/redis
image:
  repository: redis
  tag: "8.8.0"
  pullPolicy: IfNotPresent

# Authentication settings.
auth:
  # -- Enable password authentication (requirepass).
  enabled: true
  # -- Password used for authentication. When left empty and auth.enabled is
  # true, a random password is generated and stored in a Secret. On upgrades
  # the previously generated password is preserved.
  password: ""

# -- Safety override. By default the chart refuses to render when authentication
# is disabled AND the Service is exposed via NodePort/LoadBalancer, since that
# leaves Redis reachable from outside the cluster with no password. Set this to
# true only if you fully understand and accept that risk.
dangerouslyAllowUnauthenticatedExternalAccess: false

# Persistence settings. When enabled, a PersistentVolumeClaim is created and
# mounted at /data so that the append-only file (AOF) survives pod restarts.
persistence:
  enabled: true
  size: "10Gi"
  # -- StorageClass for the PVC. Empty string uses the cluster default
  # StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Redis server tuning. These map directly to redis.conf directives.
redis:
  # -- Maximum amount of memory Redis will use for the dataset.
  maxmemory: "512mb"
  # -- Eviction policy applied once maxmemory is reached.
  maxmemoryPolicy: "allkeys-lru"

# Kubernetes Service exposing Redis on port 6379.
service:
  type: ClusterIP
  port: 6379

# Container resource requests and limits.
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Probe tuning (all probes use `redis-cli ping`).
probes:
  # The startup probe gates liveness/readiness until Redis has finished coming
  # up. This matters when persistence is enabled: on restart with a large
  # append-only file (AOF), Redis can take a while to replay it and will fail
  # ping until done. The generous failure window below (~5 min) prevents the
  # liveness probe from killing the pod mid-recovery.
  startup:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

# Optional overrides.
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []
podAnnotations: {}
podSecurityContext:
  fsGroup: 999
containerSecurityContext:
  runAsUser: 999
  runAsNonRoot: true

nodeSelector: {}
tolerations: []
affinity: {}
